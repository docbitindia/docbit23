[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "https://www.docbit.in/*"
  to = "https://docbit.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/workspace"
  to = "/workspace/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects/index.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/team/index.html"
  status = 200

[[redirects]]
  from = "/plans"
  to = "/plans/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/documentation"
  to = "/documentation/index.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support/index.html"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/auth/signup"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/password/reset"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pricing"
  to = "/plans"
  status = 301
  force = true

[[redirects]]
  from = "/docs"
  to = "/documentation"
  status = 301
  force = true

[[headers]]
  for = "/auth/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/password/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/workspace*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/projects*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/team*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/profile*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/settings*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/usage-plan*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/analyzing*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/editing*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
